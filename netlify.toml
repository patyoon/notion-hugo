[build]
publish = "public"
command = "git lfs install && git lfs pull && git submodule update --force --init --recursive --depth=1 && npm install && npm start && hugo --gc --minify && (npm run algolia || echo '[Warn] Algolia index update failed; search results may be stale') && rm -rf /opt/build/cache"
[build.environment]
  HUGO_VERSION = "0.155.2"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  ALGOLIA_INDEX_FILE = "public/algolia.json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    # Enforced CSP. 'unsafe-inline' is required by the theme's inline scripts and styles
    # (sidebar sizing, Disqus and Algolia bootstrap, Hugo TOC, inline style attributes in posts).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.disqus.com https://*.disquscdn.com https://*.algolia.net https://*.algolianet.com https://gc.zgo.at https://plausible.io; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://*.disquscdn.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com https://*.disquscdn.com; img-src 'self' data: blob: https:; media-src 'self' https:; frame-src https://disqus.com https://*.disqus.com https://www.youtube.com https://www.youtube-nocookie.com https://www.facebook.com https://web.facebook.com https://player.vimeo.com https://w.soundcloud.com; connect-src 'self' https://*.algolia.net https://*.algolianet.com https://*.disqus.com https://*.disquscdn.com https://*.goatcounter.com https://plausible.io https://patyoon.report-uri.com; report-uri https://patyoon.report-uri.com/r/d/csp/enforce; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy =  "vibrate=(), geolocation=(), midi=(), notifications=(), push=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), speaker=(), vibrate=(), fullscreen=(), payment=()"
    # Reserve text and data mining rights (EU DSM Art. 4, TDMRep protocol)
    tdm-reservation = "1"
    tdm-policy = "https://patyoon.com/terms/"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
	from = "/*"
	to = "/404/"
	status = 404

[[plugins]]
  package = "netlify-plugin-cloudinary"

  [plugins.inputs]
  cloudName = "dalfipdrf"
  imagesPath = "/uploads"

[functions]
  node_bundler = "esbuild"